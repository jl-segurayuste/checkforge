name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Instalar dependencias
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Tests (pytest)
        run: pytest -q

  dogfood:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar
        run: pip install -e .
      - name: auditkit se analiza a sí mismo
        # Solo el paquete real, no tests/: los tests de "secrets" contienen a
        # proposito cadenas con forma de secreto (para probar que se detectan),
        # asi que analizar tests/ aqui siempre "encontraria" sus propios fixtures.
        run: auditkit analyze auditkit --fail-on high

  example-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar auditkit (local) + el plugin de ejemplo
        run: |
          pip install -e .
          pip install -e "./examples/js-stale-deps-plugin[dev]"
      - name: El plugin se descubre de verdad
        run: auditkit list-checks | grep -q js_stale_deps
      - name: Lint (ruff) del plugin
        run: ruff check examples/js-stale-deps-plugin
      - name: Tests del plugin
        run: pytest -q examples/js-stale-deps-plugin
