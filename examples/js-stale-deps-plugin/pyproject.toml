[project]
name = "repo-health-js-example"
version = "0.1.0"
description = "Plugin de ejemplo para repo-health: dependencias JS declaradas sin usar / usadas sin declarar."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "repo-health>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.6",
]

# Esta es la unica parte que un plugin de terceros necesita para que
# `repo-health list-checks`/`analyze` lo descubra -- nada mas que instalar
# este paquete en el mismo entorno que repo-health.
[project.entry-points."repo_health.checks"]
js_stale_deps = "repo_health_js_example.check:JsStaleDepsCheck"

[tool.setuptools.packages.find]
include = ["repo_health_js_example*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
