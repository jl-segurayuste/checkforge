[project]
name = "auditkit-js-example"
version = "0.1.0"
description = "Plugin de ejemplo para auditkit: dependencias JS declaradas sin usar / usadas sin declarar."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "auditkit>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.6",
]

# Esta es la unica parte que un plugin de terceros necesita para que
# `auditkit list-checks`/`analyze` lo descubra -- nada mas que instalar
# este paquete en el mismo entorno que auditkit.
[project.entry-points."auditkit.checks"]
js_stale_deps = "auditkit_js_example.check:JsStaleDepsCheck"

[tool.setuptools.packages.find]
include = ["auditkit_js_example*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
