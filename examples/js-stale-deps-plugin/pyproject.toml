[project]
name = "checkforge-js-example"
version = "0.1.0"
description = "Plugin de ejemplo para checkforge: dependencias JS declaradas sin usar / usadas sin declarar."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "checkforge>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.6",
]

# Esta es la unica parte que un plugin de terceros necesita para que
# `checkforge list-checks`/`analyze` lo descubra -- nada mas que instalar
# este paquete en el mismo entorno que checkforge.
[project.entry-points."checkforge.checks"]
js_stale_deps = "checkforge_js_example.check:JsStaleDepsCheck"

[tool.setuptools.packages.find]
include = ["checkforge_js_example*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
