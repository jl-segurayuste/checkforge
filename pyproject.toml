[project]
name = "auditkit"
version = "0.1.0"
description = "Agregador de auditorías de repositorios: dependencias, secretos, código muerto, hotspots de git — un informe, arquitectura de plugins."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.6",
]

[project.scripts]
auditkit = "auditkit.cli:main"

# Los checks incorporados se registran igual que lo haria un plugin de
# terceros -- el nucleo no les da ningun trato especial. Cualquiera puede
# anadir un check nuevo publicando un paquete propio con una entrada en
# este mismo grupo, sin tocar este repo.
[project.entry-points."auditkit.checks"]
secrets = "auditkit.checks.secrets:SecretsCheck"
dead_files = "auditkit.checks.dead_files:DeadFilesCheck"
git_hotspots = "auditkit.checks.git_hotspots:GitHotspotsCheck"
stale_deps = "auditkit.checks.stale_deps:StaleDepsCheck"
readme_drift = "auditkit.checks.readme_drift:ReadmeDriftCheck"

[tool.setuptools.packages.find]
include = ["auditkit*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
